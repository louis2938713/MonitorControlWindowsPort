name: Release

# Push a tag like v4.4.0 (or v4.5.0-beta.1 for a pre-release) to build and publish a GitHub release
# with the x64 and ARM64 installers and the Velopack update packages.
# Release notes: write .github/release-notes/<tag>.md before tagging (generated from commits otherwise).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore MonitorControl.Windows.slnx --locked-mode

      - name: Test
        run: dotnet test --solution MonitorControl.Windows.slnx -c Release --no-restore

      - name: Publish
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/MonitorControl.App/MonitorControl.App.csproj -c Release -r $rid --self-contained `
              -p:Version=${{ steps.version.outputs.version }} -o publish/$rid
          }

      # ---- Code signing (Phase 11, disabled until the SignPath Foundation account exists) ----
      # Enable by setting the repository variable ENABLE_SIGNING=true and the SignPath secrets/variables.
      - name: Upload unsigned binaries
        if: vars.ENABLE_SIGNING == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: publish

      - name: Sign binaries (SignPath)
        if: vars.ENABLE_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish
      # -----------------------------------------------------------------------------------------

      - name: Package
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          foreach ($rid in 'win-x64', 'win-arm64') {
            # The previous release's package lets vpk build a delta package (small download for existing installs).
            vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} `
              --channel $rid --outputDir releases
            if ($LASTEXITCODE -ne 0) { Write-Warning "No previous $rid release: full package only"; $global:LASTEXITCODE = 0 }
            vpk pack --packId MonitorControl --packVersion ${{ steps.version.outputs.version }} --packDir publish/$rid `
              --mainExe MonitorControl.exe --packTitle MonitorControl --packAuthors MonitorControl `
              --icon src/MonitorControl.App/Assets/AppIcon.ico --runtime $rid --channel $rid --outputDir releases
          }

      # Same shape as the official macOS releases ("MonitorControl vX.Y.Z" with MonitorControl.X.Y.Z.dmg):
      # MonitorControl.X.Y.Z.exe (x64) and MonitorControl.X.Y.Z-arm64.exe installers, plus the files the
      # in-app updater reads (releases.<channel>.json and .nupkg) and SHA-256 checksums.
      - name: Assemble release assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item releases/MonitorControl-win-x64-Setup.exe "assets/MonitorControl.$version.exe"
          Copy-Item releases/MonitorControl-win-arm64-Setup.exe "assets/MonitorControl.$version-arm64.exe"
          # Only this version's packages (the previous one downloaded for deltas is already in its own release).
          Copy-Item "releases/MonitorControl-$version-*.nupkg", releases/releases.*.json assets/
          Get-ChildItem assets -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content assets/SHA256SUMS.txt -Encoding utf8
          Get-Content assets/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $arguments = @('release', 'create', $tag, '--title', "MonitorControl $tag")
          # Hand-written notes in the official style when present, otherwise the commit/PR list.
          $notes = ".github/release-notes/$tag.md"
          if (Test-Path $notes) { $arguments += @('--notes-file', $notes) } else { $arguments += '--generate-notes' }
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          $arguments += (Get-ChildItem assets -File).FullName
          gh @arguments
